<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client timeline</title>
<!--
  Tiny Monster client timeline (embed for Notion).

  One client:   timeline.html?c=Alba_Coffee~Onboarding,First_payment,Discovery_call,Design_direction~2
  Many clients: add one more c= per client:  ...&c=Nomad_Skincare~Kickoff,Audit,Concepts~1
  Format of c:  Name~Milestone1,Milestone2,...~StepsDone   (underscores become spaces)
  Options:      &theme=dark | light   (default follows the system)
                &names=0              (hide client names, for a single-client page)
-->
<style>
:root{
  --fg:#1f2330; --muted:#8a8fa0; --track:#dfe2ea; --done:#3b6cf6; --current:#e0457b;
  --halo:rgba(224,69,123,.18); --card:rgba(31,35,48,.045); --bg:transparent;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root.dark{--fg:#eceef5;--muted:#8b90a3;--track:#3a3e4c;--done:#6b93ff;--current:#ff6b9f;--halo:rgba(255,107,159,.22);--card:rgba(255,255,255,.05)}
@media (prefers-color-scheme: dark){:root:not(.light){--fg:#eceef5;--muted:#8b90a3;--track:#3a3e4c;--done:#6b93ff;--current:#ff6b9f;--halo:rgba(255,107,159,.22);--card:rgba(255,255,255,.05)}}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);padding:10px 12px}
#out{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:12px;padding:18px 20px 16px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.client{font-weight:700;font-size:14px}
.pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;display:flex}
li{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
li::before{content:"";position:absolute;top:9px;left:50%;width:100%;height:3px;background:var(--track);border-radius:2px}
li:last-child::before{display:none}
li.done::before{background:var(--done)}
.dot{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;box-sizing:border-box;background:transparent;border:3px solid var(--track);flex:none}
li.done .dot{background:var(--done);border-color:var(--done)}
li.current .dot{border-color:var(--current);box-shadow:0 0 0 6px var(--halo)}
.txt{display:flex;flex-direction:column;align-items:inherit;gap:4px;min-width:0}
.label{font-size:12px;line-height:1.35;color:var(--muted);padding-inline:4px;overflow-wrap:anywhere}
li.done .label{color:var(--fg)}
li.current .label{color:var(--current);font-weight:700}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--current);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:8px 4px}
@media (max-width:640px){
  ol{flex-direction:column}
  li{flex-direction:row;align-items:flex-start;text-align:left;gap:14px;padding-bottom:18px}
  li:last-child{padding-bottom:0}
  li::before{top:21px;left:9px;width:3px;height:calc(100% - 21px)}
  .label{padding-top:1px;font-size:13px}
}
</style>
</head>
<body>
<div id="out"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var th=q.get('theme');
  if(th==='dark')document.documentElement.classList.add('dark');
  if(th==='light')document.documentElement.classList.add('light');
  var showNames=q.get('names')!=='0';
  var out=document.getElementById('out');
  var raw=q.getAll('c');
  var demo=false;
  if(!raw.length){demo=true;raw=['Alba_Coffee~Onboarding,First_payment,Discovery_call,Design_direction,First_design_review,Design_created,Delivery,Launch~4'];}
  function clean(s){return s.replace(/_/g,' ').trim()}
  var n=0;
  raw.forEach(function(r){
    var p=r.split('~');
    if(p.length<3)return;
    var steps=p[1].split(',').map(clean).filter(Boolean);
    if(!steps.length)return;
    var done=Math.max(0,Math.min(steps.length,parseInt(p[2],10)||0));
    n++;
    var card=document.createElement('div');card.className='card';
    var head=document.createElement('div');head.className='head';
    var nm=document.createElement('span');nm.className='client';nm.textContent=showNames?clean(p[0]):'';
    var pc=document.createElement('span');pc.className='pct';
    pc.textContent=done+' of '+steps.length+' done · '+Math.round(done/steps.length*100)+'%';
    head.appendChild(nm);head.appendChild(pc);card.appendChild(head);
    var ol=document.createElement('ol');
    steps.forEach(function(t,i){
      var li=document.createElement('li');
      li.className=i<done?'done':(i===done?'current':'');
      var d=document.createElement('span');d.className='dot';
      var box=document.createElement('div');box.className='txt';
      if(i===done){var g=document.createElement('span');g.className='tag';g.textContent='In progress';box.appendChild(g)}
      var l=document.createElement('span');l.className='label';l.textContent=t;box.appendChild(l);
      li.appendChild(d);li.appendChild(box);ol.appendChild(li);
    });
    card.appendChild(ol);out.appendChild(card);
  });
  if(demo){var e=document.createElement('div');e.className='empty';e.textContent='Sample shown. The real timeline appears when the link carries a client, for example ?c=Name~Step1,Step2,Step3~1';out.appendChild(e)}
  else if(!n){var e2=document.createElement('div');e2.className='empty';e2.textContent='No timeline to show yet.';out.appendChild(e2)}
})();
</script>
</body>
</html>
